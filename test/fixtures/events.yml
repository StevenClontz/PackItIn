# Times are relative to now so there are always upcoming and past events; they are ISO 8601 strings
# (with a UTC offset) so both fixtures and the dev seeds read them as the same instant.
pack_meeting:
  title: Pack Meeting
  description: Monthly pack meeting with games and advancement awards.
  starts_at: "<%= 1.week.from_now.change(hour: 18).iso8601 %>"
  ends_at: "<%= 1.week.from_now.change(hour: 19, min: 30).iso8601 %>"

campout:
  title: Fall Campout
  description: Weekend campout. Bring a sleeping bag.
  starts_at: "<%= 3.weeks.from_now.change(hour: 17).iso8601 %>"
  ends_at: "<%= (3.weeks.from_now + 2.days).change(hour: 11).iso8601 %>"
  rsvp_deadline_at: "<%= 2.weeks.from_now.change(hour: 12).iso8601 %>"

past_hike:
  title: Trail Hike
  starts_at: "<%= 2.weeks.ago.change(hour: 9).iso8601 %>"
  ends_at: "<%= 2.weeks.ago.change(hour: 12).iso8601 %>"

weekend_trip:
  title: Weekend Trip
  description: A trip you can join for the day or stay the whole weekend.
  starts_at: "<%= 5.weeks.from_now.change(hour: 8).iso8601 %>"
  ends_at: "<%= (5.weeks.from_now + 2.days).change(hour: 16).iso8601 %>"
