# These fixtures are also the development sample data: `bin/rails db:seed` loads them
# (see db/seeds.rb), so `examplefamily` and `adminfamily` are the dev logins.
# Usernames are stored lowercase, as Devise would store them.
# Fixture passwords are all "password123".
one:
  username: examplefamily
  name: The Example Family
  street_address: 100 Main St
  city: Austin
  state: tx
  zip: "78701"
  encrypted_password: <%= Devise::Encryptor.digest(Family, "password123") %>

two:
  username: joneses
  name: The Joneses
